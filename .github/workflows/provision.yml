name: Provision Starry ID Central D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '輸入 APPLY 才允許更新正式 starry_id_db'
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.event.inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Provision central D1 and audit source members
        run: bash starry-id/provision-and-audit.sh
      - name: Upload non-PII audit report
        uses: actions/upload-artifact@v7
        with:
          name: starry-id-member-audit
          path: starry-id/audit-output/member-audit.json
          if-no-files-found: error
