name: One-time v251 card theme migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v251-theme-migration-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply only v251 public-card theme migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute starry_id_db --remote --command "SELECT COUNT(*) AS value FROM users" --json > /tmp/before.json
          BEFORE=$(node starry-id/read-count.mjs /tmp/before.json)
          npx wrangler d1 execute starry_id_db --remote --file=starry-id/migrations/20261015_public_card_themes.sql --yes
          npx wrangler d1 execute starry_id_db --remote --command "SELECT COUNT(*) AS value FROM users" --json > /tmp/after.json
          AFTER=$(node starry-id/read-count.mjs /tmp/after.json)
          test "$BEFORE" = "$AFTER"
          npx wrangler d1 execute starry_id_db --remote --command "SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE '_cf_%' ORDER BY name" --json > /tmp/schema.json
          node starry-id/verify-schema.mjs /tmp/schema.json
          npx wrangler d1 execute starry_id_db --remote --command "SELECT COUNT(*) AS value FROM public_card_preferences" --json > /tmp/prefs.json
          PREFS=$(node starry-id/read-count.mjs /tmp/prefs.json)
          echo "v251 migration verified: users before=$BEFORE after=$AFTER preferences=$PREFS"
