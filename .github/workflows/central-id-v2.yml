name: Central ID v2 safe public shell

on:
  push:
    paths:
      - "central-id-v2/**"
      - ".github/workflows/central-id-v2.yml"
  pull_request:
    paths:
      - "central-id-v2/**"
      - ".github/workflows/central-id-v2.yml"

permissions:
  contents: read

jobs:
  public-shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and security gate
        run: node --test central-id-v2/test/*.test.mjs
      - name: H-Global center D1 migration and revocation tests
        run: python3 central-id-v2/test/center_migration_schema_test.py
      - name: iOS two-developer account D1 partition tests
        run: python3 central-id-v2/test/ios_catalog_schema_test.py
