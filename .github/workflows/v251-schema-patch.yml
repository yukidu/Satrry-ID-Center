name: v251 schema patch

on:
  push:
    branches:
      - safe/v251-card-themes-schema
    paths:
      - .github/workflows/v251-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v251-card-themes-schema
      - name: Patch canonical schema files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('starry-id/schema.sql')
          text = schema.read_text()
          marker = '-- 若會員手動把電子名片編號改成較大的 n 編號，立即把 AUTOINCREMENT 水位推到該編號。'
          block = '''-- v251：公開電子名片視覺樣式。編輯頁與公開頁共用同一個固定主題。\nCREATE TABLE IF NOT EXISTS public_card_preferences (\n  userId TEXT PRIMARY KEY,\n  theme TEXT NOT NULL DEFAULT 'starry-cosmos' CHECK(theme IN (\n    'starry-cosmos','golden-prestige','aurora-realm','sunrise-paper','neon-pulse',\n    'forest-whisper','ocean-flow','sakura-ink','lunar-minimal','royal-gem'\n  )),\n  updatedAt INTEGER NOT NULL,\n  FOREIGN KEY(userId) REFERENCES users(id) ON DELETE CASCADE\n);\nCREATE INDEX IF NOT EXISTS public_card_preferences_theme ON public_card_preferences(theme);\n\n'''
          if 'CREATE TABLE IF NOT EXISTS public_card_preferences' not in text:
              assert marker in text
              text = text.replace(marker, block + marker, 1)
              schema.write_text(text)

          provision = Path('starry-id/provision-and-audit.sh')
          text = provision.read_text()
          needle = 'npx wrangler d1 execute "$DB_NAME" --remote --file=starry-id/migrations/20261015_battery_ledger.sql --yes\n'
          addition = needle + 'npx wrangler d1 execute "$DB_NAME" --remote --file=starry-id/migrations/20261015_public_card_themes.sql --yes\n'
          if '20261015_public_card_themes.sql' not in text:
              assert needle in text
              provision.write_text(text.replace(needle, addition, 1))

          verify = Path('starry-id/verify-schema.mjs')
          text = verify.read_text()
          needle = "'auth_sessions', 'public_cards', 'profile_field_visibility'"
          repl = "'auth_sessions', 'public_cards', 'public_card_preferences', 'profile_field_visibility'"
          if "'public_card_preferences'" not in text:
              assert needle in text
              verify.write_text(text.replace(needle, repl, 1))
          PY
          git rm .github/workflows/v251-schema-patch.yml
          git config user.name 'Starry Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add starry-id/schema.sql starry-id/provision-and-audit.sh starry-id/verify-schema.mjs
          git commit -m 'schema: wire public card theme migration'
          git push origin HEAD:safe/v251-card-themes-schema
