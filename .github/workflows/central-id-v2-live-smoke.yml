name: Central ID v2 live endpoint smoke

on:
  pull_request:
    paths:
      - ".github/workflows/central-id-v2-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live custom domain and health
        run: |
          set -euo pipefail
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25             -D /tmp/headers.txt -o /tmp/home.html https://id.hglobal1985.com/
          grep -q '目前開放的是新版官方資訊頁' /tmp/home.html
          grep -qi '^x-robots-tag: noindex' /tmp/headers.txt
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25             https://id.hglobal1985.com/healthz -o /tmp/status.json
          node -e 'const d=require("/tmp/status.json"); if(d.status!=="ok"||d.phase!=="public-information"||d.member_login_enabled!==false) process.exit(1)'
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25 \
            https://id.hglobal1985.com/api/v1/status -o /tmp/migration-status.json
          node -e 'const d=require("/tmp/migration-status.json"); if(d.legacy_snapshot?.state!=="copied-and-verified" || d.legacy_snapshot?.tables!==61 || d.legacy_snapshot?.rows!==4849 || !d.legacy_snapshot?.isolated || d.legacy_linked!==false || d.member_login_enabled!==false) process.exit(1)'
          curl -fSs --max-time 25 https://id.hglobal1985.com/api/v1/compat/readiness -o /tmp/compat-ready.json
          node -e 'const d=require("/tmp/compat-ready.json"); if(d.status!=="ok"||d.storage!=="connected"||!d.migration_audit_present||d.ticket_exchange_enabled||d.echo_cutover_ready||d.live_legacy_auth!=="read_only_live_checked")process.exit(1)'
          curl -fSs --max-time 25 https://id.hglobal1985.com/api/session -o /tmp/anonymous-session.json
          node -e 'if(require("/tmp/anonymous-session.json").authenticated!==false)process.exit(1)'
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/ticket-rejected.json -X POST -H "Origin: https://echo.starry.phd" https://id.hglobal1985.com/api/apps/echostars/ticket)
          test "$STATUS" = "503"
          node -e 'if(require("/tmp/ticket-rejected.json").error!=="ticket_exchange_not_ready")process.exit(1)'
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/private-rejected.json https://id.hglobal1985.com/api/v1/me)
          test "$STATUS" = "401"
          echo 'PASS: production Echo compatibility has DB but cannot authorize cutover'
