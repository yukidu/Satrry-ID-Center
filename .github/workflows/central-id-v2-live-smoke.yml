name: Central ID v2 live endpoint smoke

on:
  push:
    branches: [main]
    paths:
      - "central-id-v2/src/**"
      - "central-id-v2/migrations/**"
      - ".github/workflows/central-id-v2-live-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/central-id-v2-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live custom domain and health
        run: |
          set -euo pipefail
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25             -D /tmp/headers.txt -o /tmp/home.html https://id.hglobal1985.com/
          grep -q '目前開放的是新版官方資訊頁' /tmp/home.html
          grep -qi '^x-robots-tag: noindex' /tmp/headers.txt
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25             https://id.hglobal1985.com/healthz -o /tmp/status.json
          node -e 'const d=require("/tmp/status.json"); if(d.status!=="ok"||d.phase!=="public-information"||d.member_login_enabled!==false) process.exit(1)'
          curl -fS --retry 4 --retry-all-errors --retry-delay 5 --max-time 25 \
            https://id.hglobal1985.com/api/v1/status -o /tmp/migration-status.json
          node -e 'const d=require("/tmp/migration-status.json"); if(d.legacy_snapshot?.state!=="copied-and-verified" || d.legacy_snapshot?.tables!==61 || d.legacy_snapshot?.rows!==4849 || !d.legacy_snapshot?.isolated || d.legacy_linked!==false || d.member_login_enabled!==false) process.exit(1)'
          curl -fSs --max-time 25 https://id.hglobal1985.com/api/v1/compat/readiness -o /tmp/compat-ready.json
          node -e 'const d=require("/tmp/compat-ready.json"); if(d.status!=="ok"||d.storage!=="connected"||!d.migration_audit_present||d.ticket_exchange_enabled!==true||d.echo_cutover_ready||d.live_legacy_auth!=="read_only_live_checked")process.exit(1)'
          curl -fSs --max-time 25 https://id.hglobal1985.com/api/session -o /tmp/anonymous-session.json
          node -e 'if(require("/tmp/anonymous-session.json").authenticated!==false)process.exit(1)'
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/ticket-rejected.json -X POST -H "Origin: https://echo.starry.phd" https://id.hglobal1985.com/api/apps/echostars/ticket)
          test "$STATUS" = "401"
          node -e 'if(require("/tmp/ticket-rejected.json").error!=="unauthorized")process.exit(1)'
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/private-rejected.json https://id.hglobal1985.com/api/v1/me)
          test "$STATUS" = "401"
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/invalid-ticket.json -X POST -H "Content-Type: application/json" -d '{"appId":"echostars","code":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' https://id.hglobal1985.com/api/v1/compat/tickets/consume)
          test "$STATUS" = "401"
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/bad-google.json -X POST -H "Origin: https://echo.starry.phd" -H "Content-Type: application/json" -d '{"appId":"echostars","credential":"forged.invalid.token"}' https://id.hglobal1985.com/api/google-sync)
          test "$STATUS" = "401"
          STATUS=$(curl -sS --max-time 25 -w "%{http_code}" -o /tmp/invalid-origin.json -X POST -H "Origin: https://evil.example" -H "Content-Type: application/json" -d '{"appId":"echostars","credential":"invalid"}' https://id.hglobal1985.com/api/google-sync)
          test "$STATUS" = "403"
          curl -fSs --max-time 25 -o /tmp/portal-home.html https://id.hglobal1985.com/
          grep -q 'href="/login">Google 會員登入' /tmp/portal-home.html
          curl -fSs --max-time 25 -D /tmp/portal-headers.txt -o /tmp/portal-login.html https://id.hglobal1985.com/login
          grep -q 'id="google-button"' /tmp/portal-login.html
          grep -qi "content-security-policy:.*accounts.google.com/gsi/client" /tmp/portal-headers.txt
          STATUS=$(curl -sS --max-time 25 -o /tmp/portal-private.html -w "%{http_code}" https://id.hglobal1985.com/dashboard)
          test "$STATUS" = "303"
          curl -fSs --max-time 25 -D /tmp/portal-challenge-headers.txt -o /tmp/portal-challenge.json https://id.hglobal1985.com/api/v1/portal/challenge
          node -e 'const d=require("/tmp/portal-challenge.json");if(d.nonce?.length!==43 || !d.google_client_id?.endsWith(".apps.googleusercontent.com"))throw Error("bad challenge")'
          grep -qi 'set-cookie:.*HttpOnly.*Secure.*SameSite=Lax' /tmp/portal-challenge-headers.txt
          STATUS=$(curl -sS --max-time 25 -o /tmp/portal-badgoogle.json -w "%{http_code}" -X POST -H "Origin: https://id.hglobal1985.com" -H "Content-Type: application/json" -d '{"appId":"central","termsAccepted":true,"credential":"forged.bad.jwt"}' https://id.hglobal1985.com/api/v1/portal/google-login)
          test "$STATUS" = "401"
          STATUS=$(curl -sS --max-time 25 -o /tmp/portal-noauth.json -w "%{http_code}" https://id.hglobal1985.com/api/v1/portal/me)
          test "$STATUS" = "401"
          curl -fSs --max-time 25 -o /tmp/portal-client.js https://id.hglobal1985.com/portal.js
          grep -q 'google.accounts.id.initialize' /tmp/portal-client.js
          node -e 'const fs=require("fs");const d=require("/tmp/migration-status.json");if(d.portal_entry_available!==true || d.member_login_enabled!==false)throw Error("portal readiness misreported")'
          curl -fSs --max-time 25 https://id.hglobal1985.com/api/v1/apps/status -o /tmp/first-party-api.json
          node -e 'const d=require("/tmp/first-party-api.json");if(d.enabled!==true||d.app_registration!=="allowlist-only"||d.privileged_scopes_enabled!==false||d.member_database_direct_access!==false||d.battery_access_enabled!==false)throw Error("first-party API not safely deployed")'
          curl -fSs --max-time 25 https://id.hglobal1985.com/apps/api-test -o /tmp/first-party-page.html
          grep -q '中央會員 API｜正式自測' /tmp/first-party-page.html
          curl -fSs --max-time 25 https://id.hglobal1985.com/apps/api-test.js -o /tmp/first-party-page.js
          grep -q '/api/v1/apps/token' /tmp/first-party-page.js
          STATUS=$(curl -sS --max-time 25 -o /tmp/first-party-anon.json -w "%{http_code}" https://id.hglobal1985.com/api/v1/apps/me)
          test "$STATUS" = "401"
          STATUS=$(curl -sS --max-time 25 -o /tmp/first-party-evil.json -w "%{http_code}" -H 'Origin: https://evil.example' -X POST -H 'Content-Type: application/json' -d '{"app_id":"hglobal-web"}' https://id.hglobal1985.com/api/v1/apps/challenge)
          test "$STATUS" = "403"
          STATUS=$(curl -sS --max-time 25 -o /tmp/first-party-no-origin.json -w "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{"app_id":"hglobal-web"}' https://id.hglobal1985.com/api/v1/apps/challenge)
          test "$STATUS" = "400"
          curl -fSs --max-time 25 -H 'Origin: https://id.hglobal1985.com' -X POST -H 'Content-Type: application/json' -d '{"app_id":"hglobal-web"}' https://id.hglobal1985.com/api/v1/apps/challenge -o /tmp/first-party-challenge.json
          node -e 'const d=require("/tmp/first-party-challenge.json");if(d.nonce?.length!==43||!d.google_client_id?.endsWith(".apps.googleusercontent.com")||d.expires_in!==600)throw Error("first-party nonce issuance failed")'
          echo 'PASS: first-party status, authorized challenge, self-test UI, anonymous & hostile origin rejection'
          echo 'PASS: production home login CTA, secure Google nonce, protected dashboard, forged token rejection, Echo isolation'
          echo 'PASS: actual production Echo tickets enabled, live revocation source verified, anonymous and forged attempts rejected; full Echo cutover gate remains false'
