name: One-time Starry ID Central D1 Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy central D1 schema and migrations
        run: bash starry-id/provision-and-audit.sh
      - name: Verify member count after deploy
        shell: bash
        run: |
          npx wrangler d1 execute starry_id_db --remote --command "SELECT COUNT(*) AS users FROM users" --json > /tmp/users.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/users.json','utf8'));
          const parts=Array.isArray(raw)?raw:(raw.result||[]);
          const row=parts.flatMap(x=>x?.results||[])[0]||{};
          const users=Number(row.users||0);
          if (users !== 56) throw new Error(`Unexpected central member count after deploy: ${users}`);
          console.log(`Production central D1 verified: users=${users}`);
          NODE
      - name: Upload non-PII audit report
        uses: actions/upload-artifact@v4
        with:
          name: starry-id-member-audit-production
          path: starry-id/audit-output/member-audit.json
          if-no-files-found: error
